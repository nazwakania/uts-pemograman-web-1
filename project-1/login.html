<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mochi & Bloom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-pastel">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mochi &amp; Bloom</a>
        <div class="ms-auto d-flex gap-2">
          <a class="nav-link" href="index.html">Beranda</a>
          <a class="nav-link" href="register.html">Registrasi</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-pastel p-4">
          <h3 class="text-center fw-bold mb-2" style="color: #d86c93;">Login Akun</h3>
          <p class="text-center text-muted small mb-4">Masuk untuk membuka Halaman Menu Utama</p>

          <!-- Tempat menampilkan pesan validasi JS -->
          <div id="pesanLogin"></div>

          <form onsubmit="validasiLogin(event)">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" id="username" class="form-control" placeholder="Masukkan username (nazwa)">
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Masukkan password (242011002)">
            </div>
            <button type="submit" class="btn btn-pastel w-100 mb-3">Login</button>
            <p class="text-center small mb-0">
              Belum punya akun? <a href="register.html" style="color: #d86c93; font-weight: 700;">Daftar di sini</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      @Copyright by 242011002_Nazwa Kania Maulani_TIF RP 24 F
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
