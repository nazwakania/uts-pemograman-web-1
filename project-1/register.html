<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - Mochi & Bloom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-pastel">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mochi &amp; Bloom</a>
        <div class="ms-auto d-flex gap-2">
          <a class="nav-link" href="index.html">Beranda</a>
          <a class="btn btn-pastel" href="login.html">Login</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-pastel p-4">
          <h3 class="text-center fw-bold mb-2" style="color: #d86c93;">Registrasi Akun</h3>
          <p class="text-center text-muted small mb-4">Buat akun baru Mochi &amp; Bloom Patisserie</p>

          <div id="pesanRegister"></div>

          <form onsubmit="validasiRegister(event)">
            <div class="mb-3">
              <label for="regNama" class="form-label fw-semibold">Nama Lengkap</label>
              <input type="text" id="regNama" class="form-control" placeholder="Nazwa Kania Maulani">
            </div>
            <div class="mb-3">
              <label for="regUsername" class="form-label fw-semibold">Username</label>
              <input type="text" id="regUsername" class="form-control" placeholder="nazwa">
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label fw-semibold">Email</label>
              <input type="email" id="regEmail" class="form-control" placeholder="nazwa@email.com">
            </div>
            <div class="mb-4">
              <label for="regPassword" class="form-label fw-semibold">Password</label>
              <input type="password" id="regPassword" class="form-control" placeholder="Buat password">
            </div>
            <button type="submit" class="btn btn-pastel w-100 mb-3">Daftar</button>
            <p class="text-center small mb-0">
              Sudah punya akun? <a href="login.html" style="color: #d86c93; font-weight: 700;">Login di sini</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      @Copyright by 242011002_Nazwa Kania Maulani_TIF RP 24 F
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
